name: "Uppfinna Forge: Gitaly Upstream Sync"

# Automated upstream sync for the UppFinna Gitaly fork.
#
#   GitLab Gitaly upstream                UppFinna Gitaly fork
#            |                                     |
#     checkout upstream                     checkout master
#            |                                     |
#   build and run tools/sync                       |
#   (patches the upstream tree)                    |
#            |                                     |
#      patched-upstream  ---- three-way merge ---> staging-<sha>
#      (vendor branch)         (base: previous            |
#                               vendor commit)   push -> merge request
#
# The whole upstream-to-fork transformation lives in the Go program at
# `tools/sync` of the Gitaly source project, NOT in this file. The workflow
# only checks the sources out, builds and runs that program, and turns its
# output into a commit, a branch and a merge request. New transformations are
# therefore added as a new patch in `tools/sync/patches/`, without touching
# this workflow: the tool reports the branch name, the commit message and the
# list of applied patches back through `$GITHUB_OUTPUT`.
#
# Regenerating the protobuf bindings is part of that transformation: the
# `protogen` patch runs the `proto` make target, which downloads and builds the
# protobuf compiler plugins on first use. Pass `--skip protogen` to the tool if
# a run must stay offline; the bindings then keep upstream's go_package.
#
# Three branches are maintained on the fork:
#   - `upstream`: a plain mirror of the upstream ref. It never carries a commit
#     of our own and is force-updated on every run.
#   - `patched-upstream`: the vendor branch. Nothing but the patched upstream
#     tree, one commit per synced upstream commit, plus a `refs/upstream-sync/
#     <upstream sha>` ref per commit so any of them can be found again.
#   - `staging-<short sha>`: the merge request source. A single commit on top
#     of the target branch holding the three-way merge of the target branch
#     with the new vendor tree.
#
# The merge base is the vendor commit the target branch last received, which
# the sync records in `.upstream-sync` inside the patched tree. That is what
# keeps the merge request down to the upstream delta and, more importantly,
# what preserves the fork's own work: files only the fork has are in neither
# vendor tree, so the merge never touches them, and fork edits inside upstream
# files merge line by line. A genuine overlap, both sides changing the same
# lines, is reported as a conflict and left to a human.
#
# Bootstrapping, once: run the workflow with `upstream-ref` set to the upstream
# commit the fork was last built from. It creates the vendor branch without
# opening a merge request. Then commit that same upstream commit ID into
# `.upstream-sync` on the target branch. Every later run is fully automatic.
#
# Checkout uses the same `Project-Tick-Infrastructure/checkout@v5` action every
# other workflow here uses (see gitaly-ci.yml), including for the upstream
# clone, so there is no bespoke clone logic in this repository.
#
# As with every workflow in this repository, a missing credential never fails
# the run: without a push token the sync still runs and reports the diff it
# would have produced, and the push / merge request steps are skipped with a
# warning.

on:
  schedule:
    # Nightly, offset from the hour to avoid the scheduler's peak.
    - cron: "0 * * * *"
  # Both trigger blocks declare the canonical Foreman inputs on top of the
  # sync-specific ones, so a Foreman dispatch is never rejected with a 422
  # "Unexpected inputs provided" (same contract as gitaly-ci.yml).
  workflow_call:
    inputs:
      upstream-repository: { type: string, default: "" }
      upstream-ref: { type: string, default: "" }
      fork-repository: { type: string, default: "" }
      target-branch: { type: string, default: "" }
      source-repository: { type: string, default: "" }
      source-ref: { type: string, default: "" }
      callback_url: { type: string, default: "" }
      callback_token: { type: string, default: "" }
      foreman-pipeline-id: { type: string, default: "" }
      foreman-plan: { type: string, default: "" }
      foreman-callback-url: { type: string, default: "" }
      foreman-callback-token: { type: string, default: "" }
  workflow_dispatch:
    inputs:
      upstream-repository:
        description: Upstream Gitaly repository to sync from.
        type: string
        default: ""
      upstream-ref:
        description: "Upstream ref to sync. Defaults to master."
        type: string
        default: ""
      fork-repository:
        description: UppFinna Gitaly repository to sync into.
        type: string
        default: ""
      target-branch:
        description: "Merge request target branch. Defaults to master."
        type: string
        default: ""
      source-repository: { type: string, default: "" }
      source-ref: { type: string, default: "" }
      callback_url: { type: string, default: "" }
      callback_token: { type: string, default: "" }
      foreman-pipeline-id: { type: string, default: "" }
      foreman-plan: { type: string, default: "" }
      foreman-callback-url: { type: string, default: "" }
      foreman-callback-token: { type: string, default: "" }

permissions: {}

# One sync at a time: concurrent runs would race on the `upstream` mirror.
concurrency:
  group: gitaly-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream Gitaly
    runs-on: ubuntu-24.04
    # Same image gitaly-ci.yml builds and tests with: debian bookworm, go 1.25,
    # git 2.51.
    container:
      image: registry.gitlab.com/gitlab-org/gitlab-build-images/debian-bookworm-golang-1.25-rust-1.73:git-2.51
    permissions:
      contents: read
    env:
      UPSTREAM_REPOSITORY: ${{ inputs.upstream-repository || vars.GITALY_UPSTREAM_REPOSITORY || 'https://gitlab.com/gitlab-org/gitaly.git' }}
      UPSTREAM_REF: ${{ inputs.upstream-ref || vars.GITALY_UPSTREAM_REF || 'master' }}
      FORK_REPOSITORY: ${{ inputs.fork-repository || vars.GITALY_FORK_REPOSITORY || 'https://projecttick.org/project-tick/uppfinna/forge/gitaly.git' }}
      # Project path used against the API, URL-encoded at call time. Must match
      # FORK_REPOSITORY; a numeric project ID works here as well.
      FORK_PROJECT: ${{ vars.GITALY_FORK_PROJECT || 'project-tick/uppfinna/forge/gitaly' }}
      TARGET_BRANCH: ${{ inputs.target-branch || vars.GITALY_FORK_DEFAULT_BRANCH || 'master' }}
      MIRROR_BRANCH: ${{ vars.GITALY_MIRROR_BRANCH || 'upstream' }}
      VENDOR_BRANCH: ${{ vars.GITALY_VENDOR_BRANCH || 'patched-upstream' }}
      MARKER_FILE: ${{ vars.GITALY_MARKER_FILE || '.upstream-sync' }}
      API_V4_URL: ${{ vars.PT_API_V4_URL || 'https://projecttick.org/api/v4' }}
      GITLAB_USERNAME: ${{ vars.PT_GITLAB_SOURCE_USERNAME || 'oauth2' }}
      GITLAB_TOKEN: ${{ secrets.PT_GITLAB_SYNC_TOKEN || secrets.PT_GITLAB_SOURCE_TOKEN || '' }}
      GIT_USER_NAME: ${{ vars.PT_GIT_BOT_NAME || 'Project Tick Bot' }}
      GIT_USER_EMAIL: ${{ vars.PT_GIT_BOT_EMAIL || 'bot@projecttick.org' }}
      GOFLAGS: "-buildvcs=false -modcacherw"
    defaults:
      run:
        shell: bash
    steps:
      - name: Install jq (container images lack it)
        run: command -v jq >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y --no-install-recommends jq; }

      - name: Foreman job init
        uses: Project-Tick/Project-Tick/.github/actions/foreman-job-wrapper@master
        with:
          # Foreman dispatches the snake_case pair today and the kebab-case one
          # when the plan-injection feature flag is on; accept both.
          callback_url:      ${{ inputs.callback_url || inputs.foreman-callback-url }}
          callback_token:    ${{ inputs.callback_token || inputs.foreman-callback-token }}
          pipeline_id:       ${{ inputs.foreman-pipeline-id }}
          foreman_api_token: ${{ secrets.FOREMAN_API_TOKEN }}
          job_name:          ${{ github.job }}
          plan_json:         ${{ inputs.foreman-plan }}

      - name: Check push credential
        id: credentials
        run: |
          set -euo pipefail
          if [[ -z "${GITLAB_TOKEN:-}" ]]; then
            echo "::warning::PT_GITLAB_SYNC_TOKEN is not set — the sync runs, but push and merge request are skipped."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      # This checkout is both the source of the sync tool and the merge request
      # source: the staging branch is cut from it, so it needs full history.
      - name: Checkout UppFinna Gitaly (sync tool and staging base)
        uses: Project-Tick-Infrastructure/checkout@v5
        with:
          path: uppfinna
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          source-repository: ${{ env.FORK_REPOSITORY }}
          source-auth-token: ${{ env.GITLAB_TOKEN }}
          source-auth-username: ${{ env.GITLAB_USERNAME }}
          show-progress: 'false'

      # Full history: the `upstream` mirror branch is pushed from this
      # checkout, and pushing a shallow clone would truncate it.
      - name: Checkout upstream Gitaly
        uses: Project-Tick-Infrastructure/checkout@v5
        with:
          path: upstream
          fetch-depth: 0
          ref: ${{ env.UPSTREAM_REF }}
          source-repository: ${{ env.UPSTREAM_REPOSITORY }}
          show-progress: 'false'

      - name: Build sync tool
        working-directory: uppfinna/tools/sync
        run: go build -o "${RUNNER_TEMP}/gitaly-upstream-sync" .

      # The vendor branch carries nothing but the patched upstream tree. It is
      # the "theirs" side of the three-way merge, and the tree it had at the
      # previous sync is the merge base, which is what keeps the fork's own
      # work out of the diff.
      - name: Check out the vendor branch
        id: vendor
        working-directory: uppfinna
        run: |
          set -euo pipefail
          git config user.name "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"

          # The checkout action leaves a detached HEAD at the target branch.
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [[ -n "${GITLAB_TOKEN:-}" ]]; then
            git remote add fork "https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@${FORK_REPOSITORY#https://}"
            git fetch --no-tags --quiet fork \
              "+refs/heads/${VENDOR_BRANCH}:refs/heads/${VENDOR_BRANCH}" \
              "+refs/upstream-sync/*:refs/upstream-sync/*" || true
          fi

          if git rev-parse --verify --quiet "refs/heads/${VENDOR_BRANCH}" >/dev/null; then
            git switch --quiet "${VENDOR_BRANCH}"
          else
            echo "::notice::${VENDOR_BRANCH} does not exist yet; this run bootstraps it."
            git switch --quiet --orphan "${VENDOR_BRANCH}"
          fi

      - name: Run sync tool
        id: sync
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitaly-upstream-sync" \
            --source upstream \
            --target uppfinna \
            --keep _build \
            --commit-message-file "${RUNNER_TEMP}/gitaly-sync-commit-message.txt" \
            --output "${GITHUB_OUTPUT}"

      - name: Commit the vendor branch
        id: vendor-commit
        working-directory: uppfinna
        env:
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          UPSTREAM_SHORT_SHA: ${{ steps.sync.outputs.upstream_short_sha }}
        run: |
          set -euo pipefail
          git add --all

          if git rev-parse --verify --quiet HEAD >/dev/null && git diff --cached --quiet; then
            echo "::notice::${VENDOR_BRANCH} already carries upstream ${UPSTREAM_SHORT_SHA}."
          else
            # The trailer is what `refs/upstream-sync/<sha>` mirrors, and what
            # makes a vendor commit traceable back to its upstream commit.
            {
              cat "${RUNNER_TEMP}/gitaly-sync-commit-message.txt"
              echo ""
              echo "Upstream-commit: ${UPSTREAM_SHA}"
            } > "${RUNNER_TEMP}/vendor-commit-message.txt"
            git commit --quiet --file "${RUNNER_TEMP}/vendor-commit-message.txt"
          fi

          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the staging commit
        id: commit
        working-directory: uppfinna
        env:
          BASE: ${{ steps.vendor.outputs.base }}
          VENDOR_COMMIT: ${{ steps.vendor-commit.outputs.commit }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          UPSTREAM_SHORT_SHA: ${{ steps.sync.outputs.upstream_short_sha }}
        run: |
          set -euo pipefail
          echo "committed=false" >> "$GITHUB_OUTPUT"

          # The marker travels with the patched tree, so the target branch
          # records the upstream commit it last received, and the vendor commit
          # of that upstream commit is the merge base.
          previous="$(git show "${BASE}:${MARKER_FILE}" 2>/dev/null | tr -d '[:space:]' || true)"
          merge_base=""
          if [[ -n "$previous" ]]; then
            merge_base="$(git rev-parse --verify --quiet "refs/upstream-sync/${previous}" || true)"
          fi

          if [[ -z "$merge_base" ]]; then
            echo "::notice::${TARGET_BRANCH} records no vendored upstream commit yet. Pushing ${VENDOR_BRANCH} only; commit ${MARKER_FILE} on ${TARGET_BRANCH} with the upstream commit it was forked from to enable merge requests."
            exit 0
          fi

          if [[ "$merge_base" == "$VENDOR_COMMIT" ]]; then
            echo "::notice::${TARGET_BRANCH} is already synced with upstream ${UPSTREAM_SHORT_SHA}."
            exit 0
          fi

          # Three-way merge of the target branch with the new vendor tree,
          # based on the vendor tree it last received. Files only the fork has
          # are in neither vendor tree, so the merge leaves them alone, and
          # fork edits inside upstream files survive line by line.
          if ! tree="$(git merge-tree --write-tree --merge-base="$merge_base" "$BASE" "$VENDOR_COMMIT")"; then
            echo "::error::Upstream ${UPSTREAM_SHORT_SHA} conflicts with ${TARGET_BRANCH} and needs a manual merge."
            printf '%s\n' "$tree"
            exit 1
          fi

          if [[ "$tree" == "$(git rev-parse "${BASE}^{tree}")" ]]; then
            echo "::notice::Upstream ${UPSTREAM_SHORT_SHA} changes nothing on ${TARGET_BRANCH}."
            exit 0
          fi

          # One commit on top of the target branch, so the merge request holds
          # a single commit and squashes to exactly that.
          commit="$(git commit-tree "$tree" -p "${BASE}" -F "${RUNNER_TEMP}/gitaly-sync-commit-message.txt")"
          git branch --force "${BRANCH}" "$commit"

          echo "committed=true" >> "$GITHUB_OUTPUT"
          git --no-pager show --oneline --shortstat "$commit"

      - name: Push upstream mirror and vendor branch
        if: steps.credentials.outputs.has_token == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          VENDOR_COMMIT: ${{ steps.vendor-commit.outputs.commit }}
        run: |
          set -euo pipefail
          git -C upstream push --force \
            "https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@${FORK_REPOSITORY#https://}" \
            "${UPSTREAM_SHA}:refs/heads/${MIRROR_BRANCH}"
          git -C uppfinna push --force fork \
            "${VENDOR_COMMIT}:refs/heads/${VENDOR_BRANCH}" \
            "${VENDOR_COMMIT}:refs/upstream-sync/${UPSTREAM_SHA}"

      - name: Push staging branch
        if: steps.credentials.outputs.has_token == 'true' && steps.commit.outputs.committed == 'true'
        working-directory: uppfinna
        env:
          BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          set -euo pipefail
          git push --force fork "refs/heads/${BRANCH}:refs/heads/${BRANCH}"

      - name: Create merge request
        if: steps.credentials.outputs.has_token == 'true' && steps.commit.outputs.committed == 'true'
        env:
          BRANCH: ${{ steps.sync.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          UPSTREAM_SHORT_SHA: ${{ steps.sync.outputs.upstream_short_sha }}
          APPLIED_PATCHES: ${{ steps.sync.outputs.patches }}
          CHANGED_FILES: ${{ steps.sync.outputs.changed_files }}
          MIRRORED_FILES: ${{ steps.sync.outputs.mirrored_files }}
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail

          project="$(jq -rn --arg path "${FORK_PROJECT}" '$path|@uri')"
          description="$(printf '%s\n\n- Upstream repository: %s\n- Upstream ref: %s\n- Upstream commit: %s\n- Applied patches: %s\n- Patched files: %s\n- Mirrored paths: %s\n- Workflow run: %s\n' \
            "Automated sync of upstream Gitaly into the UppFinna fork." \
            "${UPSTREAM_REPOSITORY}" "${UPSTREAM_REF}" "${UPSTREAM_SHA}" \
            "${APPLIED_PATCHES:-none}" "${CHANGED_FILES}" "${MIRRORED_FILES}" "${RUN_URL}")"
          payload="$(jq -nc \
            --arg source "${BRANCH}" \
            --arg target "${TARGET_BRANCH}" \
            --arg title "Sync upstream ${UPSTREAM_SHORT_SHA}" \
            --arg description "$description" \
            '{
              source_branch: $source,
              target_branch: $target,
              title: $title,
              description: $description,
              remove_source_branch: true,
              squash: true
            }')"

          if response="$(curl \
            --silent --show-error --fail-with-body \
            --retry 3 --retry-all-errors --max-time 30 \
            --request POST \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "${API_V4_URL%/}/projects/${project}/merge_requests")"; then
            merge_request_url="$(jq -r '.web_url // ""' <<< "$response")"
          else
            # A merge request for this staging branch may already exist, for
            # instance when a run is retried. Fall back to reporting that one.
            response="$(curl \
              --silent --show-error --fail --max-time 30 --get \
              --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              --data-urlencode "source_branch=${BRANCH}" \
              --data-urlencode "target_branch=${TARGET_BRANCH}" \
              --data-urlencode "state=opened" \
              "${API_V4_URL%/}/projects/${project}/merge_requests")"
            merge_request_url="$(jq -r '.[0].web_url // ""' <<< "$response")"

            if [[ -z "$merge_request_url" ]]; then
              echo "::error::Could not create a merge request from ${BRANCH} into ${TARGET_BRANCH}."
              exit 1
            fi
            echo "Merge request for ${BRANCH} already exists."
          fi

          {
            echo "### Gitaly upstream sync"
            echo ""
            echo "- Upstream commit: \`${UPSTREAM_SHA}\`"
            echo "- Staging branch: \`${BRANCH}\`"
            echo "- Merge request: ${merge_request_url}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Foreman job finalize
        if: always()
        uses: Project-Tick/Project-Tick/.github/actions/foreman-job-finalize@master
        with:
          callback_url:      ${{ inputs.callback_url || inputs.foreman-callback-url }}
          callback_token:    ${{ inputs.callback_token || inputs.foreman-callback-token }}
          pipeline_id:       ${{ inputs.foreman-pipeline-id }}
          foreman_api_token: ${{ secrets.FOREMAN_API_TOKEN }}
          job_name:          ${{ github.job }}
          job_status:        ${{ job.status }}
